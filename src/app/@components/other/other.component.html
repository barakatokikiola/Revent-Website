<div class="container">
    <div class="header">
        <h2>Other</h2>

        <div class="icon_container">
            <lucide-icon name="maximize-2" [size]="20" [strokeWidth]="2" class="icon"></lucide-icon>
        </div>
    </div>

    <div class="content">
        <div class="other" *ngFor="let other of others">
            <img [src]="other.img" alt="">
            <h4>{{other.dept}}</h4>
            <h3>{{other.title}}</h3>
            <p class="content-description">{{other.desc}}</p>
        </div>
    </div>
</div>
