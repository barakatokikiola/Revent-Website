<div class="features" *ngIf="feature">
    <div class="design">
        <h4 class="muted_text side">Designs & Iterations</h4>
        <h3 class="main">Some features we implemented</h3>
            </div>
    <div class="content">
        <button class="colored_btn side">See Live</button>
     <div class="main">
        <div  *ngFor="let f of feature">
            <h4>{{f.title}}</h4>
            <p>{{f.desc1}}</p>
            <p>{{f.desc2}}</p>
            <img [src]="f.img" alt="">
                <div class="thumbnail">
                        <img [src]="item" alt="" *ngFor="let item of f.thumbnail">
                </div>
            </div>
       
     </div>
    </div>
</div>
